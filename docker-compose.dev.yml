services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+ expects the volume on /var/lib/postgresql (not .../data).
      # https://github.com/docker-library/postgres/issues/37
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    env_file:
      - path: .env
        required: true
    environment:
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:${N8N_PORT:-5678}"
    env_file:
      - path: .env
        required: true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget -qO- http://127.0.0.1:${N8N_PORT:-5678}/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  web_node_modules:
  postgres_data:
  n8n_data:
